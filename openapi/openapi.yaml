openapi: 3.0.3
info:
  title: Account Service API
  description: Passive products - savings, checking and fixed-term accounts
  version: 1.0.0
servers:
  - url: http://localhost:8082
paths:
  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
    post:
      tags: [Accounts]
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation or business rule (RP1-001 / RP1-002 / RP1-003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer not found in customer-service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account by id
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Accounts]
      summary: Update account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Accounts]
      summary: Delete account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Deleted
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{id}/balance:
    get:
      tags: [Accounts]
      summary: Get available balance
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{id}/deposits:
    post:
      tags: [Accounts]
      summary: Deposit
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Deposit applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Inactive account, monthly limit, fixed-term day rule, or validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{id}/withdrawals:
    post:
      tags: [Accounts]
      summary: Withdrawal
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '200':
          description: Withdrawal applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Insufficient funds, inactive account, monthly limit, or fixed-term rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/accounts/{accountId}/movements:
    get:
      tags: [Account Movements]
      summary: List movements of an account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Movement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountMovementResponse'
  /api/v1/account-movements:
    get:
      tags: [Account Movements]
      summary: List all movements
      responses:
        '200':
          description: Movement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountMovementResponse'
    post:
      tags: [Account Movements]
      summary: Create movement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMovementRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMovementResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/account-movements/{id}:
    get:
      tags: [Account Movements]
      summary: Get movement by id
      parameters:
        - $ref: '#/components/parameters/MovementId'
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMovementResponse'
        '404':
          description: Movement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Account Movements]
      summary: Update movement
      parameters:
        - $ref: '#/components/parameters/MovementId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMovementRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMovementResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Movement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Account Movements]
      summary: Delete movement
      parameters:
        - $ref: '#/components/parameters/MovementId'
      responses:
        '204':
          description: Deleted
        '404':
          description: Movement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
    MovementId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    AccountType:
      type: string
      enum: [SAVINGS, CHECKING, FIXED_TERM]
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, CLOSED]
    MovementType:
      type: string
      enum: [DEPOSIT, WITHDRAWAL]
    AccountRequest:
      type: object
      required: [customerId, accountType]
      properties:
        customerId:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        allowedTransactionDay:
          type: integer
        holders:
          type: array
          items:
            type: string
        authorizedSigners:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
    AccountResponse:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        balance:
          type: number
        maintenanceFee:
          type: number
        monthlyMovementLimit:
          type: integer
        allowedTransactionDay:
          type: integer
        holders:
          type: array
          items:
            type: string
        authorizedSigners:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BalanceResponse:
      type: object
      properties:
        accountId:
          type: string
        customerId:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        availableBalance:
          type: number
    TransactionRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
    AccountMovementRequest:
      type: object
      required: [accountId, customerId, movementType, amount]
      properties:
        accountId:
          type: string
        customerId:
          type: string
        movementType:
          $ref: '#/components/schemas/MovementType'
        amount:
          type: number
    AccountMovementResponse:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        customerId:
          type: string
        movementType:
          $ref: '#/components/schemas/MovementType'
        amount:
          type: number
        balanceAfter:
          type: number
        occurredAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
